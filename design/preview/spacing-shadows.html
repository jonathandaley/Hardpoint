<!doctype html>
<!-- @dsCard group="Spacing" name="Shadows & Glow" subtitle="Panel inset shadow + team/lock/caution glows." viewport="700x230" --><html><head><meta charset="utf-8"><title>Shadows & Glow</title>
<link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;">
    <div style="height:72px;background:#1a1a22;box-shadow:0 2px 0 #000, 0 0 0 1px #000 inset, 0 1px 0 #2a2a32 inset;"></div>
    <div style="height:72px;background:#1a1a22;box-shadow:0 0 12px rgba(51,128,255,0.55), 0 0 0 1px #3380ff inset;"></div>
    <div style="height:72px;background:#1a1a22;box-shadow:0 0 12px rgba(255,77,51,0.55), 0 0 0 1px #ff4d33 inset;"></div>

    <div class="swatch-name">panel · drop+inset</div>
    <div class="swatch-name">glow-ally</div>
    <div class="swatch-name">glow-enemy</div>

    <div style="height:72px;background:#1a1a22;box-shadow:0 0 14px rgba(40,224,198,0.6), 0 0 0 1px #28e0c6 inset;"></div>
    <div style="height:72px;background:#1a1a22;box-shadow:0 0 14px rgba(247,201,72,0.55), 0 0 0 1px #f7c948 inset;"></div>
    <div style="height:72px;background:#0d0d14;border:1px solid #000;box-shadow:inset 0 0 60px rgba(204,0,0,0.55);"></div>

    <div class="swatch-name">glow-cyan · lock</div>
    <div class="swatch-name">glow-caution</div>
    <div class="swatch-name">damage-vignette (in-game)</div>
  </div>
</div></body></html>

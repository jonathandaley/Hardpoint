<!doctype html>
<!-- @dsCard group="Colors" name="Colors — Team" subtitle="Ally blue / enemy red — never swap, all 3 shades each." viewport="700x230" --><html><head><meta charset="utf-8"><title>Colors — Team Signal</title>
<link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
    <div>
      <div style="height:90px;background:#3380ff;box-shadow:0 0 14px rgba(51,128,255,0.55) inset, 0 0 0 1px #000;"></div>
      <div style="display:flex;gap:8px;margin-top:6px;">
        <div style="flex:1;height:14px;background:#1f5fcc"></div>
        <div style="flex:1;height:14px;background:#3380ff"></div>
        <div style="flex:1;height:14px;background:#73bfff"></div>
      </div>
      <div class="swatch-name" style="margin-top:8px;color:#73bfff">ALLY · TEAM 0</div>
      <div class="swatch-hex">#1f5fcc · #3380ff · #73bfff</div>
    </div>
    <div>
      <div style="height:90px;background:#ff4d33;box-shadow:0 0 14px rgba(255,77,51,0.55) inset, 0 0 0 1px #000;"></div>
      <div style="display:flex;gap:8px;margin-top:6px;">
        <div style="flex:1;height:14px;background:#c93a26"></div>
        <div style="flex:1;height:14px;background:#ff4d33"></div>
        <div style="flex:1;height:14px;background:#ff8066"></div>
      </div>
      <div class="swatch-name" style="margin-top:8px;color:#ff8066">ENEMY · TEAM 1</div>
      <div class="swatch-hex">#c93a26 · #ff4d33 · #ff8066</div>
    </div>
  </div>
  <div class="label-micro" style="margin-top:14px;">
    Local team always blue, opposing always red (V122). Never swap. Neutral state = fg-2.
  </div>
</div></body></html>

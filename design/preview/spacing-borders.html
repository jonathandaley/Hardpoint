<!doctype html>
<!-- @dsCard group="Spacing" name="Borders & Dividers" subtitle="2px primary rule, 1px hairline; square corners." viewport="700x310" --><html><head><meta charset="utf-8"><title>Borders — Dividers & Edges</title>
<link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div style="font-family:var(--font-ui);font-size:18px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;">HANGAR</div>
  <div style="height:2px;background:#4d4d4d;margin:8px 0;"></div>
  <div style="font-family:var(--font-ui);font-size:13px;color:#7a7a85;">2px solid · rule · primary divider (matches Godot 2px ColorRect rules)</div>

  <div style="height:1px;background:#4d4d4d;margin:18px 0 8px;"></div>
  <div style="font-family:var(--font-ui);font-size:13px;color:#7a7a85;">1px solid · row hairline</div>

  <div style="height:1px;background:#2a2a32;margin:18px 0 8px;"></div>
  <div style="font-family:var(--font-ui);font-size:13px;color:#7a7a85;">1px solid · faint hairline · inside cards</div>

  <div style="margin-top:18px;display:flex;gap:10px;">
    <div style="padding:8px 14px;background:#14141a;border:1px solid #4d4d4d;font-family:var(--font-ui);font-size:13px;letter-spacing:.1em;text-transform:uppercase;">DEFAULT</div>
    <div style="padding:8px 14px;background:#14141a;border:1px solid #3380ff;color:#73bfff;font-family:var(--font-ui);font-size:13px;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 0 10px rgba(51,128,255,0.45) inset;">ACTIVE</div>
    <div style="padding:8px 14px;background:#14141a;border:1px dashed #b85c2a;color:#b85c2a;font-family:var(--font-ui);font-size:13px;letter-spacing:.1em;text-transform:uppercase;">LOCKED</div>
  </div>
  <div class="label-micro" style="margin-top:12px;">Square corners only. Radii reserved for HUD bar end caps (2px) and never used on buttons.</div>
</div></body></html>

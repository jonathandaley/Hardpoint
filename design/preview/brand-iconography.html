<!doctype html>
<!-- @dsCard group="Brand" name="Iconography" subtitle="2px stroke glyph set — beacon, lock, mech…" viewport="700x250" --><html><head><meta charset="utf-8"><title>Iconography — Glyphs</title>
<link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <style>
    .ic { display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;
          background:#14141a;border:1px solid #2a2a32;font-family:var(--font-ui);font-size:10px;
          letter-spacing:.14em;text-transform:uppercase;color:#7a7a85;}
    .ic svg{ width:32px;height:32px;stroke:#b8b8c0;fill:none;stroke-width:2;}
  </style>
  <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;">
    <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2" fill="#b8b8c0"/></svg>BEACON</div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M3 12 L12 3 L21 12 L12 21 Z"/></svg>LOCK</div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 17 L4 7 L20 7 L20 17 Z"/><path d="M8 7 L8 4 L16 4 L16 7"/></svg>HANGAR</div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3 L13 9 L20 9 L14.5 13 L17 20 L12 16 L7 20 L9.5 13 L4 9 L11 9 Z"/></svg>PILOT</div>
    <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2 L12 6 M12 18 L12 22 M2 12 L6 12 M18 12 L22 12 M5 5 L8 8 M16 16 L19 19 M5 19 L8 16 M16 8 L19 5"/></svg>SETTINGS</div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M9.5 3 H14.5 V6 H9.5 Z"/><path d="M7 7 H17 V13 H7 Z"/><path d="M7 8.5 H4 V12.5"/><path d="M17 8.5 H20 V12.5"/><path d="M9.5 13 V20"/><path d="M14.5 13 V20"/><path d="M8 20 H11"/><path d="M13 20 H16"/></svg>MECH</div>

    <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 12 L20 12 M14 6 L20 12 L14 18"/></svg>FIRE</div>
    <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7 L12 12 L16 14"/></svg>RELOAD</div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M3 19 L12 4 L21 19 Z"/><line x1="12" y1="10" x2="12" y2="14"/><circle cx="12" cy="17" r="1" fill="#b8b8c0"/></svg>ALERT</div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 2 L19 6 L19 13 C19 17 16 20 12 22 C8 20 5 17 5 13 L5 6 Z"/></svg>SHIELD</div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 4 L20 4 L20 8 L13 8 L13 20 L11 20 L11 8 L4 8 Z"/></svg>ABILITY</div>
    <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9 L15 15 M15 9 L9 15"/></svg>KILL</div>
  </div>
  <div class="label-micro" style="margin-top:14px;">2-px stroke, square caps, no rounding. Drawn inline; codebase ships none — these are the in-house style.</div>
</div></body></html>
